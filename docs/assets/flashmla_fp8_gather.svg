<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
<title id="title">FlashMLA decode：从稀疏 FP8 行到 BF16 shared tile</title><desc id="desc">V3.2：128 heads，cluster内两个CTA；每CTA处理64 heads，负责解量化32个选中token。</desc>
<style>text{font-family:Arial,"Droid Sans Fallback","Noto Sans CJK SC",sans-serif}.mono{font-family:"DejaVu Sans Mono","Droid Sans Fallback",monospace}</style>
<rect x="0" y="0" width="1200" height="1100" fill="white" stroke="white" stroke-width="1"/>
<text x="40" y="45" font-size="29" fill="#172033" font-weight="700" text-anchor="start">FlashMLA decode：从稀疏 FP8 行到 BF16 shared tile</text>
<text x="40" y="79" font-size="18" fill="#5D687A" font-weight="400" text-anchor="start">V3.2：128 heads，cluster内两个CTA；每CTA处理64 heads，负责解量化32个选中token。</text>
<text x="40" y="127" font-size="23" fill="#172033" font-weight="700" text-anchor="start">HBM：一个 token 占656 bytes；四个128维量化组共享各自的scale</text>
<rect x="40" y="148" width="760" height="66" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="420.0" y="188" font-size="20" fill="#172033" font-weight="400" text-anchor="middle">512 bytes：FP8 latent</text>
<rect x="800" y="148" width="155" height="66" fill="#FCE9C8" stroke="#CBD3DE" stroke-width="1"/>
<text x="877.5" y="188" font-size="20" fill="#172033" font-weight="400" text-anchor="middle">16 bytes</text>
<rect x="955" y="148" width="205" height="66" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="1057.5" y="188" font-size="20" fill="#172033" font-weight="400" text-anchor="middle">128 bytes</text>
<text x="40" y="246" font-size="18" fill="#172033" font-weight="400" text-anchor="start">offset 0</text>
<text x="800" y="246" font-size="18" fill="#172033" font-weight="400" text-anchor="start">512：4×FP32</text>
<text x="955" y="246" font-size="18" fill="#172033" font-weight="400" text-anchor="start">528：64×BF16</text>
<text x="40" y="289" font-size="22" fill="#172033" font-weight="700" text-anchor="start">indices → page / page内行 → 656-byte记录 → 16-byte load → dequant</text>
<rect x="40" y="314" width="240" height="44" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="343.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">同一warp的4个lane</text>
<rect x="280" y="314" width="255" height="44" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="292" y="343.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">处理同一个token</text>
<rect x="535" y="314" width="300" height="44" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="547" y="343.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">本次FP8特征范围</text>
<rect x="835" y="314" width="325" height="44" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="847" y="343.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">解量化后的写入</text>
<rect x="40" y="358" width="240" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="387.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">lane 0</text>
<rect x="280" y="358" width="255" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="292" y="387.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">选中序号 0</text>
<rect x="535" y="358" width="300" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="547" y="387.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">0..15</text>
<rect x="835" y="358" width="325" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="847" y="387.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">两条8-BF16向量</text>
<rect x="40" y="402" width="240" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="431.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">lane 8</text>
<rect x="280" y="402" width="255" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="292" y="431.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">选中序号 0</text>
<rect x="535" y="402" width="300" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="547" y="431.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">16..31</text>
<rect x="835" y="402" width="325" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="847" y="431.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">两条8-BF16向量</text>
<rect x="40" y="446" width="240" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="475.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">lane 16</text>
<rect x="280" y="446" width="255" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="292" y="475.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">选中序号 0</text>
<rect x="535" y="446" width="300" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="547" y="475.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">32..47</text>
<rect x="835" y="446" width="325" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="847" y="475.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">两条8-BF16向量</text>
<rect x="40" y="490" width="240" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="519.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">lane 24</text>
<rect x="280" y="490" width="255" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="292" y="519.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">选中序号 0</text>
<rect x="535" y="490" width="300" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="547" y="519.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">48..63</text>
<rect x="835" y="490" width="325" height="44" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="847" y="519.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">两条8-BF16向量</text>
<text x="40" y="565" font-size="23" fill="#172033" font-weight="700" text-anchor="start">shared K：64 token × 576 BF16，按 64×8 小块横向排列</text>
<rect x="190" y="595" width="222" height="119" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="301" y="627" font-size="19" fill="#172033" font-weight="400" text-anchor="middle">feature 0..7</text>
<text x="301" y="663" font-size="19" fill="#172033" font-weight="400" text-anchor="middle">64 token × 8 BF16</text>
<text x="301" y="696" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">base +0 元素</text>
<rect x="432" y="595" width="222" height="119" fill="#FCE9C8" stroke="#CBD3DE" stroke-width="1"/>
<text x="543" y="627" font-size="19" fill="#172033" font-weight="400" text-anchor="middle">feature 8..15</text>
<text x="543" y="663" font-size="19" fill="#172033" font-weight="400" text-anchor="middle">64 token × 8 BF16</text>
<text x="543" y="696" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">base +512 元素</text>
<rect x="674" y="595" width="222" height="119" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="785" y="627" font-size="19" fill="#172033" font-weight="400" text-anchor="middle">feature 16..23</text>
<text x="785" y="663" font-size="19" fill="#172033" font-weight="400" text-anchor="middle">64 token × 8 BF16</text>
<text x="785" y="696" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">base +1024 元素</text>
<rect x="916" y="595" width="222" height="119" fill="#FCE9C8" stroke="#CBD3DE" stroke-width="1"/>
<text x="1027" y="627" font-size="19" fill="#172033" font-weight="400" text-anchor="middle">feature 24..31</text>
<text x="1027" y="663" font-size="19" fill="#172033" font-weight="400" text-anchor="middle">64 token × 8 BF16</text>
<text x="1027" y="696" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">base +1536 元素</text>
<text x="40" y="629" font-size="18" fill="#172033" font-weight="400" text-anchor="start">token</text>
<text x="40" y="661" font-size="18" fill="#172033" font-weight="400" text-anchor="start">向下+1</text>
<text x="40" y="693" font-size="18" fill="#172033" font-weight="400" text-anchor="start">地址+8</text>
<text x="40" y="758" font-size="21" fill="#172033" font-weight="700" text-anchor="start">跨8个feature：+512 BF16；同一token的16个值拆开写到相隔512元素处。</text>
<rect x="40" y="789" width="525" height="156" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="56" y="819" font-size="21" fill="#172033" font-weight="700" text-anchor="start">CTA0：heads 0..63</text>
<text x="56" y="849" font-size="18" fill="#172033" font-weight="400" text-anchor="start">本地解量化 token槽 0..31</text>
<text x="56" y="878" font-size="18" fill="#172033" font-weight="400" text-anchor="start">接收 CTA1 的 token槽 32..63</text>
<text x="56" y="907" font-size="18" fill="#172033" font-weight="400" text-anchor="start">最终各自拥有完整64×576 shared K</text>
<rect x="635" y="789" width="525" height="156" fill="#FCE9C8" stroke="#CBD3DE" stroke-width="1"/>
<text x="651" y="819" font-size="21" fill="#172033" font-weight="700" text-anchor="start">CTA1：heads 64..127</text>
<text x="651" y="849" font-size="18" fill="#172033" font-weight="400" text-anchor="start">本地解量化 token槽 32..63</text>
<text x="651" y="878" font-size="18" fill="#172033" font-weight="400" text-anchor="start">接收 CTA0 的 token槽 0..31</text>
<text x="651" y="907" font-size="18" fill="#172033" font-weight="400" text-anchor="start">st.async + cluster transaction barrier</text>
<path d="M565,842 L625,842" fill="none" stroke="#172033" stroke-width="2"/>
<polygon points="625,842 616,837 616,847" fill="#172033"/>
<path d="M635,906 L575,906" fill="none" stroke="#172033" stroke-width="2"/>
<polygon points="575,906 584,901 584,911" fill="#172033"/>
<text x="40" y="994" font-size="21" fill="#172033" font-weight="400" text-anchor="start">本地写入 + DSM远端写入：分担解量化；消费者等本地与远端都ready。</text>
<text x="40" y="1043" font-size="21" fill="#174EA6" font-weight="700" text-anchor="start">V 直接复用 K 的前512维：K(token,feature) ↔ V(feature,token)，不再搬一份。</text>
</svg>
