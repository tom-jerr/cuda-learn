<text x="1316.0" y="735.0" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">QK1 R+N</text>
<rect x="1551" y="710" width="169.20000000000007" height="38" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="1635.6000000000001" y="735.0" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">PV1</text>
<rect x="893" y="825" width="141.0" height="38" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="963.5" y="850.0" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">合并/SM0/P0</text>
<rect x="1410.0" y="825" width="141.0" height="38" fill="#FCE9C8" stroke="#CBD3DE" stroke-width="1"/>
<text x="1480.5" y="850.0" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">合并/SM1/P1</text>
<text x="40" y="945" font-size="22" fill="#172033" font-weight="700" text-anchor="start">三种释放点不同：raw0在反量化完成后释放；R0在QK0完成后释放；BF16 N0要等PV0完成。</text>
<text x="40" y="993" font-size="21" fill="#174EA6" font-weight="400" text-anchor="start">所以N2可以先被TMA装入raw0，仍须等PV0结束才能反量化并覆盖BF16 slot0。</text>
<text x="40" y="1041" font-size="20" fill="#5D687A" font-weight="400" text-anchor="start">索引有4槽、raw/dequant KV有2槽；本图只展开3个索引块。Q的TMA→TMEM prologue未画。</text>
<text x="40" y="1089" font-size="20" fill="#5D687A" font-weight="400" text-anchor="start">MMA warp按源码顺序等待P-ready后发射PV，再进入下一块QK；不把QK1提前画到PV0之前。</text>
<text x="40" y="1137" font-size="20" fill="#5D687A" font-weight="400" text-anchor="start">V32的RoPE不属于V；MODEL1的RoPE也参与PV，因而其覆写门槛必须改为PV完成。</text>
