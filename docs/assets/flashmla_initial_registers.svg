<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">WGMMA 的结果分布、softmax 行视图与 P 的交接</title><desc id="desc">QK 由一个128线程 warpgroup 执行；图中的 lane 所有权描述结果寄存器，不描述 shared 读指令。</desc>
<style>text{font-family:Arial,"Droid Sans Fallback","Noto Sans CJK SC",sans-serif}.mono{font-family:"DejaVu Sans Mono","Droid Sans Fallback",monospace}</style>
<rect x="0" y="0" width="1200" height="1080" fill="white" stroke="white" stroke-width="1"/>
<text x="40" y="45" font-size="29" fill="#172033" font-weight="700" text-anchor="start">WGMMA 的结果分布、softmax 行视图与 P 的交接</text>
<text x="40" y="79" font-size="18" fill="#5D687A" font-weight="400" text-anchor="start">QK 由一个128线程 warpgroup 执行；图中的 lane 所有权描述结果寄存器，不描述 shared 读指令。</text>
<rect x="40" y="112" width="1120" height="131" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="55" y="141" font-size="21" fill="#172033" font-weight="700" text-anchor="start">u=32w+lane；线程内 slot v=0..31</text>
<text x="55" y="171" font-size="18" fill="#172033" font-weight="400" text-anchor="start">row=16w+floor(lane/4)+8×floor((v mod4)/2)</text>
<text x="55" y="200" font-size="18" fill="#172033" font-weight="400" text-anchor="start">col=2(lane mod4)+8×floor(v/4)+(v mod2)</text>
<text x="40" y="287" font-size="22" fill="#172033" font-weight="700" text-anchor="start">warp0 / lane0：最前8个 slot，按 v=0→7 的顺序展开。</text>
<rect x="40" y="312" width="160" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">slot v</text>
<rect x="200" y="312" width="120" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="212" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">0</text>
<rect x="320" y="312" width="120" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="332" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">1</text>
<rect x="440" y="312" width="120" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="452" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">2</text>
<rect x="560" y="312" width="120" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="572" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">3</text>
<rect x="680" y="312" width="120" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="692" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">4</text>
<rect x="800" y="312" width="120" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="812" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">5</text>
<rect x="920" y="312" width="120" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="932" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">6</text>
<rect x="1040" y="312" width="120" height="52" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="1052" y="345.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">7</text>
<rect x="40" y="364" width="160" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(row,col)</text>
<rect x="200" y="364" width="120" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="212" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(0,0)</text>
<rect x="320" y="364" width="120" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="332" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(0,1)</text>
<rect x="440" y="364" width="120" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="452" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(8,0)</text>
<rect x="560" y="364" width="120" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="572" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(8,1)</text>
<rect x="680" y="364" width="120" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="692" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(0,8)</text>
<rect x="800" y="364" width="120" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="812" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(0,9)</text>
<rect x="920" y="364" width="120" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="932" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(8,8)</text>
<rect x="1040" y="364" width="120" height="52" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="1052" y="397.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">(8,9)</text>
<path d="M213,450 L1120,450" stroke="#174EA6" stroke-width="2" fill="none"/>
<polygon points="1120,450 1112,445 1112,455" fill="#174EA6"/>
<text x="40" y="490" font-size="21" fill="#174EA6" font-weight="400" text-anchor="start">相邻列 → 下一行(+8) → 下一组列(+8)；之后重复，直到 token63。</text>
<rect x="40" y="525" width="340" height="49" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="556.5" font-size="18" fill="#172033" font-weight="700" text-anchor="start">view</text>
<rect x="380" y="525" width="390" height="49" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="556.5" font-size="18" fill="#172033" font-weight="700" text-anchor="start">shape</text>
<rect x="770" y="525" width="390" height="49" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="782" y="556.5" font-size="18" fill="#172033" font-weight="700" text-anchor="start">stride（线程内元素槽）</text>
<rect x="40" y="574" width="340" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="605.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">QK accumulator</text>
<rect x="380" y="574" width="390" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="605.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">((2,2,8),1,1)</text>
<rect x="770" y="574" width="390" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="782" y="605.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">((1,2,4),0,0)</text>
<rect x="40" y="623" width="340" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="654.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">softmax row / col</text>
<rect x="380" y="623" width="390" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="654.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">((2,1),(2,8,1))</text>
<rect x="770" y="623" width="390" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="782" y="654.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">((2,0),(1,4,0))</text>
<rect x="40" y="672" width="340" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="703.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">P → RS A 的重分组</text>
<rect x="380" y="672" width="390" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="703.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">((2,2,2),1,4)</text>
<rect x="770" y="672" width="390" height="49" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="782" y="703.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">((1,2,4),0,8)</text>
<text x="40" y="763" font-size="21" fill="#172033" font-weight="700" text-anchor="start">softmax 每线程2行×16列；同一行跨 lane0..3，共同归约64列。</text>
<text x="40" y="803" font-size="20" fill="#172033" font-weight="400" text-anchor="start">归约使用4-lane shuffle；P 重分组只改变 view，不做线程间搬运。</text>
<rect x="40" y="835" width="1120" height="180" fill="#FCE9C8" stroke="#CBD3DE" stroke-width="1"/>
<text x="55" y="864" font-size="21" fill="#172033" font-weight="700" text-anchor="start">首版跨 WG 的 sP：按 fragment 槽位暂存，不使用 SW128 P 布局</text>
<text x="55" y="894" font-size="18" fill="#172033" font-weight="400" text-anchor="start">shape=((2,2),128,1,8)，stride=((1,2),4,0,512)</text>
<text x="55" y="923" font-size="18" fill="#172033" font-weight="400" text-anchor="start">addr_sP(u,v)=(v mod4)+4u+512×floor(v/4)</text>
<text x="55" y="952" font-size="18" fill="#172033" font-weight="400" text-anchor="start">WG0 lane u 写出 → SReady barrier → WG1 lane u 读回 → 两边用 RS PV。</text>
<text x="40" y="1052" font-size="18" fill="#5D687A" font-weight="400" text-anchor="start">每个WG保留64×256个FP32输出=128值/线程；两WG合计32768个FP32累加值。</text>
</svg>
