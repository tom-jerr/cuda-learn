<path d="M1120,354 L1120,540" stroke="#174EA6" stroke-width="2" fill="none"/>
<polygon points="1120,540 1115,532 1125,532" fill="#174EA6"/>
<text x="1110" y="572" font-size="17" fill="#174EA6" font-weight="400" text-anchor="middle">外层 a ↓</text>
<path d="M88,580 L1058,580" stroke="#174EA6" stroke-width="2" fill="none"/>
<polygon points="1058,580 1050,575 1050,585" fill="#174EA6"/>
<text x="500" y="612" font-size="18" fill="#174EA6" font-weight="400" text-anchor="middle">每个 a 内，源码沿 j → 发出9个向量 copy；v 在一条16B指令内。</text>
<rect x="40" y="644" width="340" height="47" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="674.5" font-size="18" fill="#172033" font-weight="700" text-anchor="start">逻辑移动</text>
<rect x="380" y="644" width="380" height="47" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="674.5" font-size="18" fill="#172033" font-weight="700" text-anchor="start">global（连续物理页）</text>
<rect x="760" y="644" width="400" height="47" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="772" y="674.5" font-size="18" fill="#172033" font-weight="700" text-anchor="start">shared（SW128）</text>
<rect x="40" y="691" width="340" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="721.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">v → v+1（包内）</text>
<rect x="380" y="691" width="380" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="721.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">+1</text>
<rect x="760" y="691" width="400" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="772" y="721.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">+1</text>
<rect x="40" y="738" width="340" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="768.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">a → a+1（向下16行）</text>
<rect x="380" y="738" width="380" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="768.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">+16×576 = +9216</text>
<rect x="760" y="738" width="400" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="772" y="768.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">+16×64 = +1024</text>
<rect x="40" y="785" width="340" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="815.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">j → j+1（向右64列）</text>
<rect x="380" y="785" width="380" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="815.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">+64</text>
<rect x="760" y="785" width="400" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="772" y="815.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">+64×64 = +4096</text>
<rect x="40" y="832" width="340" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="862.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">切换整个 K buffer</text>
<rect x="380" y="832" width="380" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="392" y="862.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">重新查 block_table</text>
<rect x="760" y="832" width="400" height="47" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="772" y="862.5" font-size="18" fill="#172033" font-weight="400" text-anchor="start">±64×576 = ±36864</text>
<text x="40" y="923" font-size="21" fill="#172033" font-weight="400" text-anchor="start" class="mono">global per-thread: shape=((8,1),4,9), stride=((1,0),9216,64)</text>
<text x="40" y="967" font-size="20" fill="#174EA6" font-weight="400" text-anchor="start">shared: W(r,f)=4096⌊f/64⌋+64r+((f mod64) XOR 8(r mod8))</text>
<text x="40" y="1010" font-size="20" fill="#172033" font-weight="400" text-anchor="start">例 u=8：r=1、f=0 → global=576，shared=72；包内的8个值仍连续。</text>
<text x="40" y="1047" font-size="18" fill="#5D687A" font-weight="400" text-anchor="start">上图箭头表示逻辑遍历；异步 copy 的完成次序不能据此推断。</text>
</svg>
