<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">G2S 平铺：16×64 copy tile → 64×576 shared tile</title><desc id="desc">WG1 的局部线程 u=0..127；每次 cp.async 搬16 bytes=8 BF16。所有 offset 以 BF16 计。</desc>
<style>text{font-family:Arial,"Droid Sans Fallback","Noto Sans CJK SC",sans-serif}.mono{font-family:"DejaVu Sans Mono","Droid Sans Fallback",monospace}</style>
<rect x="0" y="0" width="1200" height="1080" fill="white" stroke="white" stroke-width="1"/>
<text x="40" y="45" font-size="29" fill="#172033" font-weight="700" text-anchor="start">G2S 平铺：16×64 copy tile → 64×576 shared tile</text>
<text x="40" y="79" font-size="18" fill="#5D687A" font-weight="400" text-anchor="start">WG1 的局部线程 u=0..127；每次 cp.async 搬16 bytes=8 BF16。所有 offset 以 BF16 计。</text>
<rect x="40" y="111" width="545" height="128" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="55" y="140" font-size="21" fill="#172033" font-weight="700" text-anchor="start">线程 layout：shape=(16,8), stride=(8,1)</text>
<text x="55" y="170" font-size="18" fill="#172033" font-weight="400" text-anchor="start">u=8r₀+c₀；value shape=(1,8)</text>
<text x="55" y="199" font-size="18" fill="#172033" font-weight="400" text-anchor="start">每轮128线程×8值 =16行×64列</text>
<rect x="615" y="111" width="545" height="128" fill="#FCE9C8" stroke="#CBD3DE" stroke-width="1"/>
<text x="630" y="140" font-size="21" fill="#172033" font-weight="700" text-anchor="start">线程 u 的完整搬运坐标</text>
<text x="630" y="170" font-size="18" fill="#172033" font-weight="400" text-anchor="start">r=floor(u/8)+16a，a=0..3</text>
<text x="630" y="199" font-size="18" fill="#172033" font-weight="400" text-anchor="start">f=8(u mod 8)+v+64j，v=0..7，j=0..8</text>
<text x="40" y="282" font-size="22" fill="#172033" font-weight="700" text-anchor="start">每格是一个16×64 tile：纵向4份，横向9份。</text>
<text x="135" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=0</text>
<text x="245" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=1</text>
<text x="355" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=2</text>
<text x="465" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=3</text>
<text x="575" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=4</text>
<text x="685" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=5</text>
<text x="795" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=6</text>
<text x="905" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=7</text>
<text x="1015" y="329" font-size="18" fill="#172033" font-weight="400" text-anchor="middle">j=8</text>
<text x="65" y="381" font-size="18" fill="#172033" font-weight="400" text-anchor="end">a=0</text>
