<text x="40" y="933" font-size="21" fill="#172033" font-weight="400" text-anchor="start">SM = softmax；↑ = 发射。WG1的SM1还要等WG0发布scale0；SM2/SM3也保持同样依赖。</text>
<text x="40" y="978" font-size="21" fill="#172033" font-weight="400" text-anchor="start">P0在SM1更新max后乘a1，再交给WG1；WG0等到WG1发射PV0R后，才发射PV1L。</text>
<text x="40" y="1023" font-size="21" fill="#174EA6" font-weight="400" text-anchor="start">wait&lt;4&gt;只保证旧PV1L结束；4个较新QK提交组可仍在途，所以TMA能与QK重叠。</text>
<text x="40" y="1068" font-size="20" fill="#5D687A" font-weight="400" text-anchor="start">图内对不同传输/计算的相对长短只选取一种合法情况；实际完成顺序与重叠长度由硬件运行决定。</text>
<text x="40" y="1113" font-size="20" fill="#5D687A" font-weight="400" text-anchor="start">首块：WG0先等完整K0后做SS QK；本图从该QK已完成、WG1的QK1仍可在途的位置展开。</text>
<text x="40" y="1154" font-size="20" fill="#5D687A" font-weight="400" text-anchor="start">右半TMA含RoPE；到达后仍逐条带等待barrier。本图为了可读性将同半边条带的服务窗口合并。</text>
