<text x="610" y="735" font-size="15" font-weight="400" fill="#18212B" text-anchor="start">等待 older QK；允许 younger PV 继续 in-flight</text>
<rect x="42" y="753" width="1516" height="36" rx="3" fill="white" stroke="#CBD5E1" stroke-width="0.8"/>
<text x="62" y="778" font-size="15" font-weight="650" fill="#18212B" text-anchor="start">完全完成</text>
<text x="250" y="778" font-size="15" font-weight="600" fill="#246BCE" text-anchor="start">wgmma_wait_group&lt;0&gt;</text>
<text x="610" y="778" font-size="15" font-weight="400" fill="#18212B" text-anchor="start">Softmax 后等待 PV 完成，再释放当前 KV stage</text>
