<text x="42" y="54" font-size="30" font-weight="700" fill="#18212B" text-anchor="start">FA3：跨 Warpgroup Pingpong 调度</text>
<text x="42" y="84" font-size="16" font-weight="400" fill="#667085" text-anchor="start">示意时序（非等比例）｜1 个 producer WG + 2 个 consumer WG</text>
<text x="42" y="132" font-size="21" font-weight="700" fill="#18212B" text-anchor="start">A  跨 Warpgroup：turn[2] mbarrier 控制 WGMMA 发射权</text>
