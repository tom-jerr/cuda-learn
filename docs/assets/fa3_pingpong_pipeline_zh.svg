<line x1="1161" y1="145" x2="1161" y2="378" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6 6"/>
<text x="610" y="145" font-size="16" font-weight="650" fill="#246BCE" text-anchor="middle">token：WG0.QK → WG1.QK → WG0.PV → WG1.PV → …</text>
