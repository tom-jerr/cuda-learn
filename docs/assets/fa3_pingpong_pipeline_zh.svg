<text x="1325" y="198" font-size="14" font-weight="650" fill="#246BCE" text-anchor="start">WG0 已可进入下一轮</text>
<line x1="42" y1="410" x2="1558" y2="410" stroke="#CBD5E1" stroke-width="1"/>
<text x="42" y="458" font-size="21" font-weight="700" fill="#18212B" text-anchor="start">B  单个 Consumer 内：older QK + younger PV 的两级异步流水</text>
