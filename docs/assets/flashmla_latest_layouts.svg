<text x="40" y="935" font-size="20" fill="#172033" font-weight="400" text-anchor="start">Dense 条带内部：16B包编号 g → g XOR (r mod8)；8个 BF16 包内顺序不变。</text>
<text x="40" y="979" font-size="20" fill="#172033" font-weight="400" text-anchor="start">Sparse 一个16-FP8加载解出16个BF16：拆为两次8-BF16写入，目的地址相差512。</text>
<text x="40" y="1026" font-size="20" fill="#174EA6" font-weight="400" text-anchor="start">两者的 V 都是 K 前512维的转置 view；地址复用，并没有另做 shared transpose。</text>
