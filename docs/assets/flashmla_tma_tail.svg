<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">新版 TMA：整页加载后，按有效长度清零 shared V</title><desc id="desc">固定 c2067be 的 BF16 dense decode；L=130，尾页起点128，valid=2。行高为示意。</desc>
