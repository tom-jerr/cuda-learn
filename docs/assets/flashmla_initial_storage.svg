<path d="M1100,309 L1100,611" stroke="#174EA6" stroke-width="2" fill="none"/>
<polygon points="1100,611 1095,603 1105,603" fill="#174EA6"/>
<text x="1125" y="448" font-size="22" fill="#174EA6" font-weight="400" text-anchor="start">↓</text>
<text x="1125" y="480" font-size="16" fill="#174EA6" font-weight="400" text-anchor="middle">+512</text>
<path d="M98,649 L1055,649" stroke="#174EA6" stroke-width="2" fill="none"/>
<polygon points="1055,649 1047,644 1047,654" fill="#174EA6"/>
<text x="550" y="680" font-size="19" fill="#174EA6" font-weight="400" text-anchor="middle">先沿 r₁ ↓ 放8个 atom，组成64×64条带；再沿 j →，每次 +4096。</text>
<text x="40" y="723" font-size="20" fill="#172033" font-weight="400" text-anchor="start">格中数字是 BF16 元素 offset；蓝色前8条带同时充当 V，黄色最后条带只用于 QK。</text>
<rect x="40" y="755" width="545" height="178" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="55" y="784" font-size="21" fill="#172033" font-weight="700" text-anchor="start">K 的逻辑坐标：(token,feature)</text>
<text x="55" y="814" font-size="18" fill="#172033" font-weight="400" text-anchor="start">shape=(64,576)；共9个64×64条带</text>
<text x="55" y="843" font-size="18" fill="#172033" font-weight="400" text-anchor="start">V 使用 feature0..511 的前8条带。</text>
<text x="55" y="872" font-size="18" fill="#172033" font-weight="400" text-anchor="start">一个K槽：36864 BF16=72 KiB；</text>
<text x="55" y="901" font-size="18" fill="#172033" font-weight="400" text-anchor="start">两个K槽：144 KiB。</text>
<rect x="615" y="755" width="545" height="178" fill="#FCE9C8" stroke="#CBD3DE" stroke-width="1"/>
<text x="630" y="784" font-size="21" fill="#172033" font-weight="700" text-anchor="start">PV 的 B view：(feature,token)</text>
<text x="630" y="814" font-size="18" fill="#172033" font-weight="400" text-anchor="start">shape=(512,64)；Vt(f,r)=K(r,f)</text>
<text x="630" y="843" font-size="18" fill="#172033" font-weight="400" text-anchor="start">底层 stride=((1,4096),64)</text>
<text x="630" y="872" font-size="18" fill="#172033" font-weight="400" text-anchor="start">仍指向相同 shared bytes；</text>
<text x="630" y="901" font-size="18" fill="#172033" font-weight="400" text-anchor="start">改变 view 不等于搬运/转置数据。</text>
<text x="40" y="987" font-size="21" fill="#172033" font-weight="700" text-anchor="start">Swizzle只重排格内16B包；外层条带的 +512、+4096 仍成立。</text>
<text x="40" y="1023" font-size="19" fill="#5D687A" font-weight="400" text-anchor="start">同一逻辑 K(1,0) 与 Vt(0,1) 都在元素地址72；完整公式见 Swizzle 图。</text>
