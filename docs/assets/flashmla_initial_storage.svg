<title id="title">Shared layout：8×64 atom 怎样平铺成64×576</title><desc id="desc">K/Q 使用 SW128。图中每格是8行×64列的 atom；格内先按列连续，再应用 XOR。</desc>
<style>text{font-family:Arial,"Droid Sans Fallback","Noto Sans CJK SC",sans-serif}.mono{font-family:"DejaVu Sans Mono","Droid Sans Fallback",monospace}</style>
<rect x="0" y="0" width="1200" height="1050" fill="white" stroke="white" stroke-width="1"/>
<text x="40" y="45" font-size="29" fill="#172033" font-weight="700" text-anchor="start">Shared layout：8×64 atom 怎样平铺成64×576</text>
<text x="40" y="79" font-size="18" fill="#5D687A" font-weight="400" text-anchor="start">K/Q 使用 SW128。图中每格是8行×64列的 atom；格内先按列连续，再应用 XOR。</text>
<rect x="40" y="111" width="1120" height="125" fill="#DCE8FF" stroke="#CBD3DE" stroke-width="1"/>
<text x="55" y="140" font-size="21" fill="#172033" font-weight="700" text-anchor="start">先不考虑 swizzle：atom shape=(8,64), stride=(64,1)</text>
<text x="55" y="170" font-size="18" fill="#172033" font-weight="400" text-anchor="start">r=r₀+8r₁，f=f₀+64j；shape=((8,8),(64,9))</text>
<text x="55" y="199" font-size="18" fill="#172033" font-weight="400" text-anchor="start">stride=((64,512),(1,4096))；e=64r₀+512r₁+f₀+4096j</text>
<text x="149" y="287" font-size="17" fill="#172033" font-weight="400" text-anchor="middle">j=0</text>
