<text x="332" y="785.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">MMA</text>
<rect x="550" y="754" width="610" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="562" y="785.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">leader 发射五类 MMA；等待各结果 / 交换就绪</text>
<rect x="40" y="802" width="130" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="833.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">WG3</text>
