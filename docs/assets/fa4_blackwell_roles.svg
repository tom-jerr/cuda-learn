<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc">
<title id="title">FA4：每 CTA 16 warps；2-CTA cluster 共 8 个 WG</title><desc id="desc">固定 ce088ab 的通用 BF16 D128 路径。WG = 连续4个warp = 128线程；不是MMA发射单位。</desc>
<style>text{font-family:Arial,"Droid Sans Fallback","Noto Sans CJK SC",sans-serif}.mono{font-family:"DejaVu Sans Mono","Droid Sans Fallback",monospace}</style>
<rect x="0" y="0" width="1200" height="1050" fill="white" stroke="white" stroke-width="1"/>
<text x="40" y="45" font-size="29" fill="#172033" font-weight="700" text-anchor="start">FA4：每 CTA 16 warps；2-CTA cluster 共 8 个 WG</text>
<text x="40" y="79" font-size="18" fill="#5D687A" font-weight="400" text-anchor="start">固定 ce088ab 的通用 BF16 D128 路径。WG = 连续4个warp = 128线程；不是MMA发射单位。</text>
<text x="40" y="129" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Forward：q_stage=2；每 CTA 两块 Q，各128行</text>
<rect x="40" y="150" width="130" height="48" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="181.0" font-size="18" fill="#172033" font-weight="700" text-anchor="start">分组</text>
<rect x="170" y="150" width="150" height="48" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
