<text x="332" y="277.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">Softmax 1</text>
<rect x="550" y="246" width="610" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="562" y="277.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">S1 → 寄存器 → rowmax / exp / rowsum → P1</text>
