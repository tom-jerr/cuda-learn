<text x="562" y="737.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">256线程协作：重建 P；计算 dS；准备 DSM 交换</text>
<rect x="40" y="754" width="130" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="785.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">WG3</text>
