<text x="332" y="325.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">Correction</text>
<rect x="550" y="294" width="610" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="562" y="325.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">O0 / O1 条件缩放；最终归一化、写 shared</text>
