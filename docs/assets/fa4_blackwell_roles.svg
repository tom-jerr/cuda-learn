<text x="562" y="517.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">动态持久化调度启用时承担 scheduler</text>
<text x="40" y="588" font-size="23" fill="#172033" font-weight="700" text-anchor="start">Backward：固定一块 KV，沿 query tiles 循环</text>
<rect x="40" y="610" width="130" height="48" fill="#F7F9FC" stroke="#CBD3DE" stroke-width="1"/>
