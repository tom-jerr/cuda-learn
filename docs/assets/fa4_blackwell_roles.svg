<text x="332" y="929.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">Idle</text>
<rect x="550" y="898" width="610" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="562" y="929.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">保留线程分组；不是另一个 compute WG</text>
<text x="40" y="998" font-size="20" fill="#174EA6" font-weight="400" text-anchor="start">2-CTA 时两边都有这些线程角色；一个联合 MMA 的发射者仍只有 leader 中的一个线程。</text>
