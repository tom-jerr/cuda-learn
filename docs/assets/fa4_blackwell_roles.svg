<text x="52" y="229.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">WG0</text>
<rect x="170" y="198" width="150" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="182" y="229.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">0–3</text>
<rect x="320" y="198" width="230" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="332" y="229.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">Softmax 0</text>
