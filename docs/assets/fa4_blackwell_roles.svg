<rect x="550" y="850" width="610" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="562" y="881.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">等本 CTA 收到 peer dS；向 leader 汇报到达</text>
<rect x="40" y="898" width="130" height="48" fill="white" stroke="#CBD3DE" stroke-width="1"/>
<text x="52" y="929.0" font-size="18" fill="#172033" font-weight="400" text-anchor="start">WG3</text>
