<text x="40" y="858" font-size="23" fill="#172033" font-weight="700" text-anchor="start">PV 开始条件：V ready ∧ P 前96列 ready ∧ 对应旧 O 已 rescale（两个 CTA 都参与）。</text>
<text x="40" y="905" font-size="22" fill="#174EA6" font-weight="400" text-anchor="start">展开一个 PV：发射 K=0..95 的6条 k16 MMA → 等 P 尾部 → 再发射 K=96..127 的2条。</text>
<text x="40" y="952" font-size="21" fill="#172033" font-weight="400" text-anchor="start">当前实现先 exp/convert 整行，再分段写 TMEM；上图省略了每个 P 的96/32细分。</text>
<text x="40" y="999" font-size="21" fill="#172033" font-weight="400" text-anchor="start">Kj 等两块 Q 的 QK 完成才释放；Vj 等两块 Q 的 PV 完成才释放。异步发射返回不等于完成。</text>
<text x="40" y="1046" font-size="22" fill="#172033" font-weight="700" text-anchor="start">Prologue：S00 → S10。稳态发射：O0j → S0,j+1 → O1j → S1,j+1。</text>
<text x="40" y="1093" font-size="21" fill="#172033" font-weight="400" text-anchor="start">Epilogue：最后 PV0 / PV1 → O 完成通知 → correction 除以 l → shared → TMA store。</text>
<text x="40" y="1140" font-size="20" fill="#5D687A" font-weight="400" text-anchor="start">版本差异：ce088ab 的 s0_s1_barrier=False；图中允许两组 softmax 重叠，不画论文中的 exp 互斥锁。</text>
