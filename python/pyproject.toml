[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cuda-learn"
version = "0.1.0"
description = "CUDA learning kernels exposed as PyTorch bindings via TVM FFI"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["cuda_learn*"]
